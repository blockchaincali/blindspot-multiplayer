<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07121b"><title>BLINDSPOT — One Runner. Many Eyes.</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;color:#eafbf9;background:#07121b;--mint:#48f9ca;--dim:#8da9b6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 15%,#163d47 0,transparent 48%),#07121b}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1160px;padding:24px;margin:0 auto}header,footer{display:flex;justify-content:space-between;align-items:center;gap:12px}header{border-bottom:1px solid #28404b;padding-bottom:24px}footer{border-top:1px solid #28404b;padding-top:18px;margin-top:50px;color:var(--dim);font-size:12px}.brand{font-size:24px;font-weight:900;letter-spacing:2px}.brand span{color:var(--mint)}.live{color:var(--mint);font-size:12px;letter-spacing:1.5px}.hero{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:40px;min-height:66vh}.eyebrow{color:var(--mint);font-size:12px;letter-spacing:2px;font-weight:700}.hero h1{font-size:clamp(44px,6.5vw,88px);line-height:1.04;letter-spacing:-3px;margin:18px 0}.hero h1 em{font-style:normal;color:var(--mint)}p{color:var(--dim);line-height:1.7}.intro{max-width:510px;font-size:18px}.panel{border:1px solid #2e535b;border-radius:20px;background:linear-gradient(150deg,#102a34dc,#091c26d9);padding:26px;box-shadow:0 18px 60px #0003}.action{display:flex;gap:12px;flex-wrap:wrap}.btn{padding:13px 18px;border-radius:11px;border:1px solid #3a606a;background:#18343f;color:#eafffb;font-weight:700}.btn:hover{filter:brightness(1.17)}.btn.primary{background:var(--mint);color:#042128;border-color:var(--mint)}.btn:disabled{opacity:.4;cursor:not-allowed}label{display:block;font-size:13px;color:#aac8ce;margin:14px 0 6px}input{background:#091923;color:white;border:1px solid #3d6068;border-radius:10px;padding:13px;width:100%;outline:none}input:focus{border-color:var(--mint)}.art,.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}.art{transform:perspective(900px) rotateY(-9deg);opacity:.8}.cell{aspect-ratio:1;border-radius:4px;background:#0b222d;border:1px solid #1d3e49}.wall{background:#24424c;border-color:#375b65}.fog{background:#06121b;border-color:#122b34}.path{background:#122e36}.runner{background:#48f9ca!important;box-shadow:0 0 15px #48f9caa8}.exit{background:#f4b964!important;box-shadow:0 0 12px #f4b96477}.fragment{background:#b09dff!important}.beacon{outline:2px solid #ffb54a}.overview{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-top:30px}.roomcode{font-size:clamp(40px,7vw,68px);font-weight:900;color:var(--mint);letter-spacing:12px;margin:12px 0}.players{display:flex;flex-wrap:wrap;gap:10px}.chip{border:1px solid #31505b;padding:10px 13px;border-radius:11px;background:#15303b}.muted{color:var(--dim)}.game{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(290px,.8fr);gap:20px;margin-top:24px}.grid{max-width:560px;width:100%;margin:10px auto}.board{padding:15px}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.big{font-weight:800;color:var(--mint)}.moves{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:7px;margin:18px}.moves button{height:52px}.moves [data-dir=up]{grid-column:2}.moves [data-dir=left]{grid-column:1}.moves [data-dir=down]{grid-column:2}.moves [data-dir=right]{grid-column:3;grid-row:2}.chatlog{height:250px;overflow:auto;background:#071722;border:1px solid #234451;border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px}.chatlog p{margin:0;font-size:13px;overflow-wrap:anywhere}.chatlog b{color:var(--mint)}.chatbox{display:flex;gap:6px}.chatbox input{min-width:0}.small{font-size:12px}.help{font-size:13px;color:#b0c7c8}.hidden{display:none!important}@media(max-width:800px){.hero,.overview,.game{grid-template-columns:1fr}.hero{padding-top:45px}.art{max-width:320px;margin:auto;transform:none}.wrap{padding:15px}.panel{padding:18px}header .live{font-size:10px}.moves{grid-template-columns:repeat(3,65px)}}
</style></head><body><div class="wrap"><header><div class="brand"><span>◉</span> BLINDSPOT</div><div class="live">● REAL-TIME CO-OP</div></header><div id="app"></div><footer><span>BLINDSPOT © 2026 · NO ACCOUNTS · NO DOWNLOADS</span><span>ONE RUNNER. MANY EYES.</span></footer></div><script>
(()=>{'use strict';
const app=document.querySelector('#app'),q=new URLSearchParams(location.search),nameKey='blindspot_name',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));
let socket,me=null,state=null,joined=null,attempt=0,connecting=false;
const send=o=>{if(socket?.readyState===1)socket.send(JSON.stringify(o))};
function connect(){if(connecting)return;connecting=true;socket=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');socket.onopen=()=>{connecting=false;attempt=0;if(joined)send({type:'join',...joined})};socket.onclose=()=>{connecting=false;if(++attempt<200)setTimeout(connect,Math.min(5000,800+attempt*300))};socket.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='error'){alert(d.message);if(joined&&d.message==='Room not found'){joined=null;me=null;state=null;history.replaceState({},'',location.pathname);render()}return}if(d.type==='joined'){me=d.id;joined={code:d.code,id:d.id,name:d.name};localStorage.setItem(nameKey,d.name);history.replaceState({},'',location.pathname+'?room='+d.code)}if(d.type==='state'){state=d;me=d.me;render()}}}
function logoArt(){let a='';for(let y=0;y<13;y++)for(let x=0;x<13;x++){const wall=x===0||y===0||x===12||y===12||((x*y+3*x+7*y)%7<2);a+='<div class="cell '+(x===1&&y===1?'runner':x===11&&y===11?'exit':wall?'wall':'path')+'"></div>'}return '<div class="art">'+a+'</div>'}
function home(){app.innerHTML='<section class="hero"><div><div class="eyebrow">✳ FREE MULTIPLAYER PARTY GAME</div><h1>One runner.<br><em>Many eyes.</em></h1><p class="intro">You are trapped in the dark. Your friends can see the way, but each has only part of the map. Talk fast, trust the crew, and escape before the signal dies.</p><p>◉ 2–6 players &nbsp; ◷ 3-minute rounds &nbsp; ↻ Endless mazes</p><form id="joinform" class="panel"><label>Your call sign</label><input id="name" maxlength="18" required placeholder="Enter your name" value="'+esc(localStorage.getItem(nameKey)||'')+'"><label>Room code (only when joining)</label><input id="code" maxlength="4" placeholder="e.g. K7XR" style="text-transform:uppercase" value="'+esc(q.get('room')||'')+'"><div class="action" style="margin-top:18px"><button class="btn primary" type="button" id="create">+ Create room</button><button class="btn" type="submit">Join with code →</button></div></form></div><div>'+logoArt()+'</div></section>';
const form=document.querySelector('#joinform'),name=()=>document.querySelector('#name').value.trim().slice(0,18);
document.querySelector('#create').onclick=()=>{if(!name())return form.reportValidity();send({type:'create',name:name()})};
form.onsubmit=e=>{e.preventDefault();const code=document.querySelector('#code').value.trim().toUpperCase();if(code.length!==4)return alert('Enter a 4-character room code');send({type:'join',name:name(),code})};}
function lobby(){const host=state.hostId===me,online=state.players.filter(p=>p.online).length;app.innerHTML='<div class="overview"><section class="panel"><div class="eyebrow">CREW ASSEMBLY</div><h1>Gather your crew.</h1><p>Share the code below. Each player joins from their own browser.</p><div class="roomcode">'+esc(state.code)+'</div><div class="action"><button class="btn" id="copy">↗ Copy invite link</button><button class="btn" id="leave">Leave room</button></div></section><section class="panel"><h2>Crew manifest <span class="muted">('+online+'/6)</span></h2><div class="players">'+state.players.map(p=>'<div class="chip">'+esc(p.name)+(p.id===state.hostId?' ★':'')+' '+(p.online?'●':'○')+'</div>').join('')+'</div><p>The Runner sees only nearby tiles. Scouts see partial maps and guide the way. Collect 3 signals to unlock the exit.</p>'+(host?'<button class="btn primary" id="start" '+(online<2?'disabled':'')+'>Launch mission →</button>':'<p class="eyebrow">WAITING FOR HOST</p>')+'</section></div>';document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>alert('Invite link copied'));document.querySelector('#leave').onclick=()=>{joined=null;state=null;history.replaceState({},'',location.pathname);render()};if(host)document.querySelector('#start').onclick=()=>send({type:'start'});}
function time(t){const n=Math.max(0,Math.ceil((t-Date.now())/1000));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function board(){let a='';for(let y=0;y<13;y++)for(let x=0;x<13;x++){const v=state.grid[y][x],runner=state.position[0]===x&&state.position[1]===y,exit=state.exit[0]===x&&state.exit[1]===y,frag=state.fragments.some((f,i)=>f[0]===x&&f[1]===y&&!state.found.includes(i)),beacon=state.beacons?.some(b=>b.x===x&&b.y===y);a+='<button class="cell '+(v===-1?'fog':v===1?'wall':'path')+' '+(runner?'runner':exit?'exit':frag?'fragment':'')+' '+(beacon?'beacon':'')+'" data-x="'+x+'" data-y="'+y+'" title="'+(v===-1?'Unknown':runner?'Runner':exit?'Exit':frag?'Signal fragment':'Tile')+'"></button>'}return a}
function game(){const runner=state.role==='RUNNER';app.innerHTML='<div class="game"><section class="panel board"><div class="stats"><span class="eyebrow">'+esc(state.role)+' MODE · ROUND '+state.round+'</span><span class="big" id="time">'+time(state.endsAt)+'</span><span>Signals <b>'+state.found.length+'/3</b></span></div><div class="grid">'+board()+'</div><p class="help">'+(runner?'Use arrow keys, WASD, or controls to navigate. Trust your scouts!':'Tap visible map tiles to place temporary beacons. Guide the Runner through chat.')+'</p>'+(runner?'<div class="moves"><button class="btn" data-dir="up">↑</button><button class="btn" data-dir="left">←</button><button class="btn" data-dir="down">↓</button><button class="btn" data-dir="right">→</button></div>':'')+'</section><section class="panel"><h2>Your crew</h2><div class="players">'+state.players.map(p=>'<span class="chip">'+esc(p.name)+(p.id===state.runnerId?' ◉ Runner':'')+'</span>').join('')+'</div><h3>Team radio</h3><div class="chatlog" id="log">'+state.messages.map(m=>'<p><b>'+esc(m.name)+':</b> '+esc(m.text)+'</p>').join('')+'</div><form id="chat" class="chatbox"><input id="msg" maxlength="180" placeholder="Send directions..." aria-label="Message"><button class="btn primary">Send</button></form><p class="help">Teal = Runner · Gold = Exit · Purple = Signal · Orange outline = Beacon</p></section></div>';
document.querySelector('#log').scrollTop=10000;document.querySelector('#chat').onsubmit=e=>{e.preventDefault();let v=document.querySelector('#msg').value.trim();if(v)send({type:'chat',text:v});document.querySelector('#msg').value=''};
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>send({type:'move',dir:b.dataset.dir}));
if(!runner)document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>send({type:'beacon',x:Number(b.dataset.x),y:Number(b.dataset.y)}));
}
function result(){app.innerHTML='<div class="panel" style="margin:60px auto;max-width:650px;text-align:center"><div class="eyebrow">ROUND '+state.round+' COMPLETE</div><h1 style="font-size:60px">'+(state.result?.won?'MISSION SUCCESS':'SIGNAL LOST')+'</h1><p>'+esc(state.result?.reason)+'</p><div class="players" style="justify-content:center">'+state.players.map(p=>'<span class="chip">'+esc(p.name)+' · '+p.score+' pts</span>').join('')+'</div><p>Next round rotates the Runner role.</p>'+(state.hostId===me?'<button id="replay" class="btn primary">Play another round ↻</button>':'<div class="eyebrow">WAITING FOR HOST TO RESTART</div>')+'</div>';document.querySelector('#replay')?.addEventListener('click',()=>send({type:'start'}))}
function render(){if(!state)return home();if(state.phase==='lobby')return lobby();if(state.phase==='playing')return game();return result()}
document.addEventListener('keydown',e=>{if(state?.phase!=='playing'||state.role!=='RUNNER'||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(d){e.preventDefault();send({type:'move',dir:d})}});
setInterval(()=>{const t=document.querySelector('#time');if(t&&state)t.textContent=time(state.endsAt)},300);
connect();render();
})();
</script></body></html>
