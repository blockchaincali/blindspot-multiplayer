<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#080c19"><title>NEON HEIST — Grab. Dash. Steal.</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c19;color:#ecf7ff;font-family:Inter,system-ui,Arial,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 0,#102f4a 0,transparent 56%),radial-gradient(ellipse at 0 70%,#1c133e 0,transparent 50%)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #45f4d2;outline-offset:3px}.wrap{max-width:1320px;margin:auto;padding:20px;position:relative}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #293347;padding:10px 0 20px}.brand{font-size:clamp(19px,3vw,29px);font-weight:1000;letter-spacing:2px}.brand b{color:#48f6d3}.tag{font-size:11px;letter-spacing:2px;color:#48f6d3}h1{font-size:clamp(46px,7vw,88px);line-height:.98;letter-spacing:-4px;margin:20px 0}h1 em{font-style:normal;color:#48f6d3}h2{margin:8px 0 15px}.hero{display:grid;grid-template-columns:1fr .85fr;gap:30px;align-items:center;min-height:75vh}.panel{background:linear-gradient(155deg,#172239eb,#0e1729e9);border:1px solid #31415f;border-radius:19px;padding:24px;box-shadow:0 15px 40px #0004}p{line-height:1.7;color:#a9b8d3}.intro{font-size:18px;max-width:540px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#48f6d3}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:13px 18px;border:1px solid #465b7c;border-radius:11px;background:#23314c;color:white;font-weight:800}.btn.primary{background:#48f6d3;color:#071b24;border-color:#48f6d3}.btn.alt{background:#e76fb0;border-color:#e76fb0;color:#250d21}.btn:hover{filter:brightness(1.12)}label{display:block;color:#aec0d5;font-size:13px;margin-bottom:7px}input{width:100%;background:#0b1426;color:#fff;border:1px solid #3d5070;padding:13px;border-radius:9px}.hero .panel{max-width:570px}.hint{font-size:12px;color:#8eacc4}.preview{position:relative;aspect-ratio:1.25;border-radius:20px;border:1px solid #385377;overflow:hidden;background:radial-gradient(circle at center,#18345c,#0a1528)}.preview span{position:absolute;font-size:43px;filter:drop-shadow(0 0 14px #56e4ec)}.preview .gem{font-size:33px}.statusline{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.room{font-size:56px;letter-spacing:9px;font-weight:900;color:#48f6d3}.pill{padding:8px 13px;border:1px solid #344967;border-radius:10px;background:#14243c}.players{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.lobby{max-width:900px;margin:60px auto}.game{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;margin-top:18px}.screen{padding:12px}.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.hud strong{color:#48f6d3;font-size:24px}.arena{position:relative;overflow:hidden;border-radius:13px;border:2px solid #365179;box-shadow:inset 0 0 40px #0008;aspect-ratio:5/3;background:#0c1731}.arena canvas{width:100%;height:100%;display:block;touch-action:none}.board{padding:16px}.board h2{font-size:19px}.rank{padding:11px;border:1px solid #2f4565;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}.rank.me{border-color:#48f6d3}.feed{font-size:12px;color:#a6b5ce;min-height:100px}.feed div{margin:7px 0}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.dpad{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.dpad button{height:45px;padding:0}.dpad button[data-dir=up]{grid-column:2}.dpad button[data-dir=left]{grid-column:1;grid-row:2}.dpad button[data-dir=down]{grid-column:2;grid-row:2}.dpad button[data-dir=right]{grid-column:3;grid-row:2}.dash{min-width:150px;min-height:70px;border-radius:18px}.scorebig{font-size:62px;color:#48f6d3;font-weight:900;margin:12px 0}.results{text-align:center;max-width:650px;margin:65px auto}footer{margin-top:35px;padding:20px 0;border-top:1px solid #2b3851;font-size:12px;color:#7f93b6}.instructions{color:#bac8dc;font-size:13px}@media(max-width:900px){.hero,.game{grid-template-columns:1fr}.hero{padding:38px 0}.preview{max-width:400px;width:100%;margin:auto}.board{order:2}.wrap{padding:12px}.panel{padding:17px}.arena{aspect-ratio:5/3}.tag{letter-spacing:1px}.dash{min-width:110px}.room{font-size:45px}}</style></head><body><div class="wrap"><header><div class="brand"><b>◆</b> NEON HEIST <small style="font-size:11px;color:#a1aec9">ARENA</small></div><div class="tag">● MULTIPLAYER MAYHEM</div></header><main id="app"></main><footer>NEON HEIST · FAST ROUNDS · ZERO SIGNUPS · FORMERLY BLINDSPOT</footer></div><script>
(()=>{'use strict';
const app=document.getElementById('app'), safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ws=null,me='',code='',data=null,lastFrame=null,connected=false,attempt=0,manualExit=false,canvas=null,ctx=null,frameId=0,keys=new Set(),direction={x:0,y:0},lastDir='',lastState='',gamepad=false;
const send=o=>{if(ws?.readyState===1)ws.send(JSON.stringify(o))},invite=()=>location.origin+location.pathname+'?room='+code;
function openSocket(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onopen=()=>{connected=true;attempt=0;if(code&&me&&!manualExit)send({type:'join',code,id:me,name:localStorage.getItem('neon-name')||'Player'});};ws.onclose=()=>{connected=false;if(!manualExit)setTimeout(openSocket,Math.min(6000,600+attempt++*400))};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){alert(m.message);if(m.message==='Room not found'){reset()}return}if(m.type==='joined'){code=m.code;me=m.id;history.replaceState({},'',location.pathname+'?room='+code);return}if(m.type==='state'){data=m;lastFrame=null;render();return}if(m.type==='frame'){const phaseChanged=m.phase!==lastState;data=m;lastFrame=m;if(phaseChanged){keys.clear();direction={x:0,y:0};render()}else if(m.phase==='playing'){updateSidebar()}}}}
function reset(){send({type:'leave'});code='';me='';data=null;lastFrame=null;lastState='';keys.clear();history.replaceState({},'',location.pathname);render()}
function showHome(){
 let initial=new URLSearchParams(location.search).get('room')||'';
 app.innerHTML='<div class="hero"><section><div class="eyebrow">✦ 90 SECONDS. ONE CHAMPION.</div><h1>GRAB.<br><em>DASH.</em><br>STEAL.</h1><p class="intro">Forget waiting your turn. Dive into a neon arena, steal points with charged dashes, chain coin streaks, and outscore everybody before the clock hits zero.</p><p>◆ 2–6 competitors &nbsp; ⏱ 90-second rounds &nbsp; 🤖 Bot rivals</p><form class="panel" id="joinForm"><label for="name">YOUR ARENA NAME</label><input id="name" maxlength="18" required placeholder="Choose a name" value="'+safe(localStorage.getItem('neon-name')||'')+'"><label for="code" style="margin-top:15px">ROOM CODE (ONLY FOR JOINING)</label><input id="code" maxlength="4" placeholder="e.g. Y8HT" value="'+safe(initial)+'" style="text-transform:uppercase"><div class="actions" style="margin-top:18px"><button type="button" class="btn primary" id="bots">🤖 PLAY VS BOTS</button><button type="button" class="btn" id="create">+ CREATE ROOM</button><button class="btn" type="submit">JOIN ROOM →</button></div></form><p class="hint">WASD / ARROWS TO MOVE · SPACE TO DASH · TOUCH CONTROLS ON MOBILE</p></section><section class="preview" aria-hidden="true"><span style="left:42%;top:44%">🟢</span><span style="left:65%;top:26%">🔴</span><span style="left:18%;top:70%">🟣</span><span class="gem" style="left:30%;top:29%">💎</span><span class="gem" style="left:77%;top:73%">⭐</span><span class="gem" style="left:52%;top:81%">💎</span></section></div>';
 const form=document.getElementById('joinForm'),name=()=>document.getElementById('name').value.trim();
 function begin(m){if(!name())return form.reportValidity();localStorage.setItem('neon-name',name());send({...m,name:name()})}
 document.getElementById('bots').onclick=()=>begin({type:'create',solo:true});
 document.getElementById('create').onclick=()=>begin({type:'create',solo:false});
 form.onsubmit=e=>{e.preventDefault();const c=document.getElementById('code').value.trim().toUpperCase();if(c.length!==4)return alert('Enter a 4-character code');begin({type:'join',code:c})};
}
function lobby(){const owner=data.host===me;app.innerHTML='<section class="panel lobby"><div class="eyebrow">PRIVATE ARENA · WAITING FOR CHALLENGERS</div><h1>ASSEMBLE YOUR<br><em>RIVALS.</em></h1><p>Share the link or room code. The winner takes the bragging rights.</p><div class="room">'+safe(data.code)+'</div><div class="players">'+data.players.map(p=>'<div class="pill" style="border-color:'+p.color+'">'+safe(p.name)+(p.bot?' 🤖':'')+(p.id===me?' · YOU':'')+'</div>').join('')+'</div><p>'+data.readyCount+' players ready · Need at least 2</p><div class="actions"><button id="share" class="btn">📋 COPY INVITE LINK</button>'+(owner?'<button id="start" class="btn primary" '+(data.readyCount<2?'disabled':'')+'>⚡ START MATCH</button>':'<span class="pill">WAITING FOR HOST</span>')+'<button id="leave" class="btn">EXIT</button></div></section>';document.getElementById('share').onclick=()=>navigator.clipboard.writeText(invite()).then(()=>alert('Invite copied'));document.getElementById('start')?.addEventListener('click',()=>send({type:'start'}));document.getElementById('leave').onclick=reset}
function render(){if(!data){lastState='';showHome();return}if(data.phase==='lobby'){lastState='lobby';lobby();return}if(data.phase==='results'){lastState='results';result();return}game()}
function game(){
 lastState='playing';app.innerHTML='<section class="game"><div class="panel screen"><div class="hud"><div><span class="eyebrow">ROUND '+data.round+' · '+safe(data.code)+'</span><div class="instructions">COLLECT SHARDS · DASH INTO RIVALS TO STEAL</div></div><strong id="timer">1:30</strong><span class="pill" id="myscore">SCORE 0</span></div><div class="arena"><canvas width="900" height="540" id="canvas"></canvas></div><div class="controls"><div class="dpad"><button class="btn" data-dir="up">▲</button><button class="btn" data-dir="left">◀</button><button class="btn" data-dir="down">▼</button><button class="btn" data-dir="right">▶</button></div><button id="dash" class="btn alt dash" title="Attack other players during the round (Space key)">⚡ DASH ATTACK<br><span id="cool">READY</span></button></div><div class="instructions">KEYBOARD: WASD / ARROWS · SPACE TO DASH · HOLD A DIRECTION TO MOVE</div></div><aside class="panel board"><h2>🏆 LIVE LEADERBOARD</h2><div id="ranking"></div><h2>⚡ ARENA FEED</h2><div class="feed" id="feed"></div><button class="btn" id="copy">📋 INVITE</button></aside></section>';
 canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');bindControls();updateSidebar();if(!frameId)frameId=requestAnimationFrame(draw)}
function updateSidebar(){if(!data||data.phase!=='playing')return;const remain=data.remaining??(data.endsAt-Date.now());const el=document.getElementById('timer');if(!el)return;el.textContent=Math.floor(Math.max(0,remain)/60000)+':'+String(Math.floor(Math.max(0,remain)%60000/1000)).padStart(2,'0');const sorted=[...data.players].sort((a,b)=>b.score-a.score);document.getElementById('ranking').innerHTML=sorted.map((p,i)=>'<div class="rank '+(p.id===me?'me':'')+'"><span><b style="color:'+p.color+'">'+(i+1)+'.</b> '+safe(p.name)+(p.bot?' 🤖':'')+(p.id===me?' (YOU)':'')+'</span><b>'+p.score+'</b></div>').join('');document.getElementById('feed').innerHTML=(data.feed||[]).slice(-5).reverse().map(f=>'<div>▸ '+safe(f.text)+'</div>').join('');const p=data.players.find(x=>x.id===me);document.getElementById('myscore').textContent='SCORE '+(p?.score||0);document.getElementById('cool').textContent=p?.cooldown>0?(p.cooldown/1000).toFixed(1)+'s':'READY'}
function result(){const rank=[...data.players].sort((a,b)=>b.score-a.score||b.kos-a.kos);const winner=rank[0],mine=rank.findIndex(p=>p.id===me);app.innerHTML='<section class="panel results"><div class="eyebrow">ROUND '+data.round+' FINISHED</div><h1>'+(winner?.id===me?'YOU <em>WIN!</em>':'GAME <em>OVER.</em>')+'</h1><p>🏆 '+safe(winner?.name||'Nobody')+' TAKES THE CROWN</p><div class="scorebig">'+(data.players.find(p=>p.id===me)?.score||0)+'</div><p>YOU PLACED #'+(mine+1)+' OUT OF '+rank.length+'</p><div class="players" style="justify-content:center">'+rank.map((p,i)=>'<span class="pill">'+(i+1)+'. '+safe(p.name)+' — '+p.score+'</span>').join('')+'</div><div class="actions" style="justify-content:center">'+(data.host===me?'<button id="again" class="btn primary">↻ PLAY AGAIN — NEW ROUND</button>':'<div class="pill">WAITING FOR HOST TO RESTART</div>')+'<button id="exit" class="btn">EXIT ARENA</button></div></section>';document.getElementById('again')?.addEventListener('click',()=>send({type:'start'}));document.getElementById('exit').onclick=reset}
function setInput(x,y){if(!data||data.phase!=='playing')return;if(direction.x!==x||direction.y!==y){direction={x,y};send({type:'input',x,y})}}
function keyboardInput(){let x=0,y=0;if(keys.has('a')||keys.has('arrowleft'))x--;if(keys.has('d')||keys.has('arrowright'))x++;if(keys.has('w')||keys.has('arrowup'))y--;if(keys.has('s')||keys.has('arrowdown'))y++;setInput(x,y)}
document.addEventListener('keydown',e=>{if(!data||data.phase!=='playing'||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowleft','arrowdown','arrowright',' '].includes(k))e.preventDefault();if(k===' '){if(!e.repeat)send({type:'dash'});return}keys.add(k);keyboardInput()});
document.addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());keyboardInput()});window.addEventListener('blur',()=>{keys.clear();setInput(0,0)});
function bindControls(){const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};document.querySelectorAll('[data-dir]').forEach(b=>{const d=dirs[b.dataset.dir];b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setInput(...d)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>setInput(0,0))});document.getElementById('dash').onclick=()=>send({type:'dash'});document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(invite()).then(()=>alert('Link copied'))}
function draw(ts){frameId=requestAnimationFrame(draw);if(!ctx||!data||data.phase!=='playing')return;const c=ctx,w=900,h=540;c.clearRect(0,0,w,h);c.fillStyle='#0b1429';c.fillRect(0,0,w,h);c.strokeStyle='#203052';c.lineWidth=1;for(let x=0;x<w;x+=36){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=0;y<h;y+=36){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
c.strokeStyle='#35577f';c.lineWidth=7;c.strokeRect(4,4,w-8,h-8);
for(const p of data.coins||[]){c.save();c.translate(p.x,p.y);c.rotate(ts/1200);c.shadowBlur=p.gold?23:14;c.shadowColor=p.gold?'#f8d06a':'#48f6d3';c.fillStyle=p.gold?'#ffcb53':'#48f6d3';c.beginPath();const z=p.gold?12:7;c.moveTo(0,-z);c.lineTo(z,0);c.lineTo(0,z);c.lineTo(-z,0);c.closePath();c.fill();c.restore()}
for(const p of data.players){c.save();c.translate(p.x,p.y);c.shadowColor=p.color;c.shadowBlur=p.dashing?34:16;c.fillStyle=p.color;c.beginPath();c.arc(0,0,p.dashing?20:16,0,Math.PI*2);c.fill();c.shadowBlur=0;c.lineWidth=p.id===me?4:2;c.strokeStyle=p.id===me?'white':'#1a2640';c.stroke();c.fillStyle='#ffffff';c.textAlign='center';c.font='bold 14px system-ui';c.fillText(p.name,-0,-28);if(p.dashing){c.strokeStyle=p.color;c.lineWidth=3;c.beginPath();c.arc(0,0,27+Math.sin(ts/50)*4,0,Math.PI*2);c.stroke()}c.restore()}
}
openSocket();render();
})();
</script></body></html>
